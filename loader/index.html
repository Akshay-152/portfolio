<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Cube Loader</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="loader-demo">
    <div class="loader-page">
      <div
        id="neon-cube-loader"
        class="neon-cube-loader"
        data-duration="3"
        data-next-page="/home/homepage.html"
        role="status"
        aria-label="Loading"
      >
        <div class="loader-progress" aria-hidden="true">
          <div class="loader-progress-meta">
            <span class="loader-progress-label">Loading</span>
            <span class="loader-progress-value">0%</span>
          </div>
          <div class="loader-progress-track">
            <span></span>
          </div>
        </div>
        <div class="loader-beam-transition" aria-hidden="true">
          <div class="beam-vertical"></div>
          <div class="beam-horizontal"></div>
          <div class="flash"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
    <script>
      // Safety net: the loader only completes when its CDN libraries loaded.
      // If one of them failed (offline, blocked), don't strand the visitor on
      // the loading screen — continue to the portfolio after a short wait.
      setTimeout(function () {
        if (window.THREE && window.gsap) return;
        var el = document.getElementById("neon-cube-loader");
        var next = (el && el.getAttribute("data-next-page")) || "/home/homepage.html";
        window.location.replace(next);
      }, 4000);
    </script>
  </body>
</html>
